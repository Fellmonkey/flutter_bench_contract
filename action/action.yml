name: 'bench-contract run'
description: >-
  Runs a flutter_bench_contract consumer's full contract in the
  bench-contract-runner Docker image (device scenarios + size + card/readme)
  in check or record mode. Requires /dev/kvm on the host (GitHub ubuntu
  runners have it) and the runner image published (package workflow
  .github/workflows/build-runner.yml). The image is pulled digest-pinned via
  the tag→digest map below — update the map when you rebuild the image.
inputs:
  flutter:
    description: >-
      Flutter version selecting the runner image tag (major.minor, e.g.
      '3.47'). Must match the Flutter version the goldens were recorded on.
    required: false
    default: '3.47'
  mode:
    description: 'check (default, gate against goldens) | record (write goldens)'
    required: false
    default: 'check'
  ref:
    description: 'Golden ref (e.g. android).'
    required: false
    default: 'android'
  dir:
    description: >-
      Consumer root under the checked-out repo (where bench_contract.yaml
      lives). Default: repo root.
    required: false
    default: '.'
  legs:
    description: >-
      S7 size legs to run (native|web|both; default native — the web leg
      stays in plain CI, where it does not need the emulator).
    required: false
    default: 'native'
  scenarios:
    description: 'Optional comma-separated scenario subset to run.'
    required: false
    default: ''
  store:
    description: >-
      Optional golden-store path, relative to the consumer root (default:
      benchmarks.json next to the manifest).
    required: false
    default: ''
  cache:
    description: >-
      Cache the Gradle + pub + NDK caches across runs: host dirs mounted
      into the container at ~/.gradle, ~/.pub-cache and the SDK's ndk dir,
      so Android build dependencies, the Gradle distribution and the NDK
      are not re-downloaded on every dispatch.
    required: false
    default: 'true'
  comment:
    description: >-
      On a check run of a pull request, post (or update) a PR comment with
      the regressions from build/check-report.json. Our own gate vs the
      recorded goldens — the chart action's alert feature stays off.
    required: false
    default: 'false'
  charts:
    description: >-
      Feed build/benchmark-data.json to benchmark-action/github-action-
      benchmark (customSmallerIsBetter) and auto-push the trend-charts page
      to the repo's gh-pages branch (created automatically on first use;
      Pages must be enabled once — Settings → Pages → Deploy from a branch).
      One dashboard per consumer repo.
    required: false
    default: 'false'
  charts-name:
    description: 'Dashboard name of the charts step (benchmark-action `name`).'
    required: false
    default: 'contract'
  charts-dir:
    description: 'Charts page directory on the gh-pages branch (default: bench).'
    required: false
    default: 'bench'
  commit:
    description: >-
      In record mode, commit the published results (commit-patterns) and
      push using the workflow's GITHUB_TOKEN. Runs on the runner host,
      never inside the image (the token must not enter the container); the
      workflow needs contents: write permission. Default: false.
    required: false
    default: 'false'
  commit-patterns:
    description: >-
      Git pathspecs (space-separated, relative to the repo root) to commit
      when commit=true — e.g. your card image and store location. Default:
      README.md benchmarks.json.
    required: false
    default: 'README.md benchmarks.json'
runs:
  using: composite
  steps:
    - name: Check KVM availability
      shell: bash
      run: |
        if [ ! -e /dev/kvm ]; then
          echo "::error::This job needs /dev/kvm (nested virtualization). GitHub ubuntu runners provide it; self-hosted runners must enable KVM."
          exit 1
        fi
    # Tag → image digest pin. A rebuild of the same tag must not change a
    # consumer's run silently: add/update the row here, then release a new
    # action tag. The digest is printed by the build-runner workflow.
    # Cache key: flutter version + consumer + a hash of the consumer's
    # dependency pins, so a lockfile bump gets a fresh cache instead of a
    # silently stale restore.
    - name: Cache key hash
      id: cache-key
      shell: bash
      run: |
        files=""
        for f in pubspec.yaml pubspec.lock android/gradle/wrapper/gradle-wrapper.properties; do
          [ -f "${{ inputs.dir }}/$f" ] && files="$files ${{ inputs.dir }}/$f"
        done
        if [ -n "$files" ]; then
          # shellcheck disable=SC2086
          echo "hash=$(git hash-object $files | md5sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
        else
          echo "hash=none" >> "$GITHUB_OUTPUT"
        fi
    - name: Restore Gradle/pub cache
      id: cache-restore
      if: ${{ inputs.cache == 'true' }}
      uses: actions/cache/restore@v4
      with:
        path: |
          /tmp/bench-contract/gradle
          /tmp/bench-contract/pub
          /tmp/bench-contract/ndk
        key: ${{ runner.os }}-bench-${{ inputs.flutter }}-${{ inputs.dir }}-${{ steps.cache-key.outputs.hash }}
        restore-keys: |
          ${{ runner.os }}-bench-${{ inputs.flutter }}-
    - name: Bench-contract run
      shell: bash
      run: |
        set -euo pipefail
        case "${{ inputs.flutter }}" in
          3.47) digest="sha256:80c1eb3b42b2fddb6249c2d3d2025ea8e2abcce6032220912fe80e39ad9011e9" ;;
          *) echo "::error::No digest pinned for Flutter ${{ inputs.flutter }} — add a row in action.yml (digest from the build-runner run summary)."
             exit 1 ;;
        esac
        if [[ "$digest" == *REPLACE_* ]]; then
          echo "::error::Runner image not built yet — run the build-runner workflow first, then paste its digest into action.yml."
          exit 1
        fi
        image="ghcr.io/fellmonkey/bench-contract-runner:${{ inputs.flutter }}@${digest}"
        extra=()
        if [ -n "${{ inputs.scenarios }}" ]; then
          extra+=(--scenarios "${{ inputs.scenarios }}")
        fi
        if [ -n "${{ inputs.store }}" ]; then
          extra+=(--store "${{ inputs.store }}")
        fi
        cache_args=()
        if [ "${{ inputs.cache }}" = "true" ]; then
          mkdir -p /tmp/bench-contract/gradle /tmp/bench-contract/pub /tmp/bench-contract/ndk
          cache_args+=(
            -v /tmp/bench-contract/gradle:/root/.gradle
            -v /tmp/bench-contract/pub:/root/.pub-cache
            -v /tmp/bench-contract/ndk:/opt/android-sdk/ndk
          )
        fi
        docker run --rm \
          --device /dev/kvm \
          "${cache_args[@]}" \
          -v "${GITHUB_WORKSPACE}":/workspace \
          -w "/workspace/${{ inputs.dir }}" \
          "$image" \
          ${{ inputs.mode }} --ref ${{ inputs.ref }} \
          --legs ${{ inputs.legs }} "${extra[@]}"
    # Commit the published results (record mode only). Host-side: pushing
    # needs the workflow's GITHUB_TOKEN, which must not be passed into the
    # container. Skips cleanly when nothing changed or patterns match no
    # files.
    - name: Commit published results
      if: ${{ inputs.mode == 'record' && inputs.commit == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        patterns=""
        for p in ${{ inputs.commit-patterns }}; do
          [ -e "$p" ] && patterns="$patterns $p"
        done
        if [ -z "$patterns" ]; then
          echo "::warning::commit-patterns matched no files; nothing to commit"
          exit 0
        fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        # shellcheck disable=SC2086
        git add $patterns
        if git diff --cached --quiet; then
          echo "bench-contract: nothing changed to commit"
          exit 0
        fi
        git commit -m "bench: publish results (goldens + metrics card)"
        git push
    # The container runs as root, so the mounted cache dirs become
    # root-owned; hand them back to the runner user before saving. Only
    # reports a key when a cache dir actually has content (a first run may
    # have nothing to save yet).
    - name: Fix cache ownership
      id: cache-own
      if: ${{ always() && inputs.cache == 'true' }}
      shell: bash
      run: |
        has_content=0
        for d in /tmp/bench-contract/gradle /tmp/bench-contract/pub /tmp/bench-contract/ndk; do
          [ -d "$d" ] && [ -n "$(ls -A "$d" 2>/dev/null)" ] && has_content=1
        done
        if [ "$has_content" = "1" ]; then
          sudo chown -R "$USER:$USER" /tmp/bench-contract 2>/dev/null || true
          echo "cache-present=true" >> "$GITHUB_OUTPUT"
        fi
    # Save once per cache key: skip when this run already restored the exact
    # key (cache entries are immutable — a same-key save would error).
    - name: Save Gradle/pub cache
      if: ${{ always() && inputs.cache == 'true' && steps.cache-own.outputs.cache-present == 'true' && steps.cache-restore.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v4
      with:
        path: |
          /tmp/bench-contract/gradle
          /tmp/bench-contract/pub
          /tmp/bench-contract/ndk
        key: ${{ runner.os }}-bench-${{ inputs.flutter }}-${{ inputs.dir }}-${{ steps.cache-key.outputs.hash }}
    # Regression PR comment (opt-in `comment`): renders the machine-readable
    # check-report.json the CLI wrote during the check. PRs only; the comment
    # is upserted on a marker anchor (no duplicates across runs).
    - name: Comment regressions on PR
      if: ${{ inputs.comment == 'true' && inputs.mode == 'check' && github.event_name == 'pull_request' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPORT: ${{ github.workspace }}/${{ inputs.dir }}/build/check-report.json
      run: |
        set -euo pipefail
        [ -f "$REPORT" ] || { echo "::warning::check-report.json not found — nothing to comment"; exit 0; }
        BODY="$(python3 - "$REPORT" <<'PY'
        import json, sys
        d = json.load(open(sys.argv[1]))
        rows = [m for m in d.get('metrics', []) if m.get('status') == 'regression']
        if not rows:
            sys.exit(0)
        out = ['## Performance regression (bench-contract gate)', '',
               '| Metric | Ref | Measured | Golden | Δ% |',
               '|---|---|---|---|---|']
        for r in rows:
            out.append(f"| {r['metric']} | {r['ref']} | {r['measured']:,} | {r['golden']:,} | {r.get('deltaPct', '')}% |")
        print('\n'.join(out))
        PY
        )"
        [ -n "$BODY" ] || { echo "bench-contract: no regressions — no comment"; exit 0; }
        marker='<!-- bench-contract:regression -->'
        pr="${{ github.event.pull_request.number }}"
        comments="repos/${{ github.repository }}/issues/$pr/comments"
        existing="$(gh api "$comments" --jq '.[] | select(.body | contains("'$marker'")) | .id' | tail -1)"
        body="$BODY
        $marker"
        if [ -n "$existing" ]; then
          gh api "repos/${{ github.repository }}/issues/comments/$existing" -X PATCH -f "body=$body" >/dev/null
        else
          gh api "$comments" -f "body=$body" >/dev/null
        fi
        echo "bench-contract: posted regression comment on PR #$pr"
    # Trend charts need the gh-pages branch to exist before the chart action
    # can auto-push to it. Create it once when missing (orphan branch with a
    # placeholder commit, pure plumbing — no checkout juggling).
    - name: Ensure charts branch
      if: ${{ inputs.charts == 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        branch="gh-pages"
        if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
          echo "bench-contract: charts branch $branch exists"
          exit 0
        fi
        blob="$(printf '# bench-contract charts (auto-generated)\n' | git hash-object -w --stdin)"
        tree="$(printf '100644 blob %s\tREADME.md\n' "$blob" | git mktree)"
        commit="$(GIT_AUTHOR_NAME='github-actions[bot]' GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com' GIT_COMMITTER_NAME='github-actions[bot]' GIT_COMMITTER_EMAIL='41898282+github-actions[bot]@users.noreply.github.com' git commit-tree "$tree" -m "init $branch for bench-contract charts")"
        git push origin "$commit:refs/heads/$branch"
        echo "bench-contract: created charts branch $branch"
        # Best effort: point Pages at the branch. Needs admin / pages: write
        # on the token; otherwise tell the user once how to do it by hand.
        if ! gh api -X POST "repos/${{ github.repository }}/pages" \
             -f "source[branch]=$branch" -f 'source[path]=/' >/dev/null 2>&1; then
          echo "::warning::Created $branch, but could not enable Pages via API (needs admin or pages: write). Set Settings → Pages → Deploy from a branch → $branch once."
        fi
    # Trend charts (opt-in `charts`): benchmark-action/github-action-
    # benchmark reads build/benchmark-data.json and pushes the gh-pages
    # dashboard. The action's own alert features stay off — our golden gate
    # (exit code / check-report) is the canonical regression signal.
    - name: Store benchmark charts
      if: ${{ inputs.charts == 'true' }}
      uses: benchmark-action/github-action-benchmark@v1
      with:
        name: ${{ inputs.charts-name }}
        tool: customSmallerIsBetter
        output-file-path: ${{ inputs.dir }}/build/benchmark-data.json
        github-token: ${{ github.token }}
        auto-push: 'true'
        gh-pages-branch: gh-pages
        benchmark-data-dir-path: ${{ inputs.charts-dir }}
        fail-on-alert: 'false'
        comment-on-alert: 'false'