# Analyzer configuration for the flutter_bench_contract package.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - .dart_tool/**
    # Templates are rendered sources (tokens like {{driverNew}} are not
    # valid Dart) — consumers analyze the rendered copies, not the sources.
    - templates/**
    # Sub-package consumer (own pubspec, own analysis in example/).
    - example/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options
